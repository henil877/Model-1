<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart UI</title>
  <link rel="stylesheet" href="css/cart.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

</head>

<body>
  <div id="header"></div>
  <h1>Shopping Cart</h1>
  <a href="index.html" class="continue-btn">
    <i class="fa-solid fa-arrow-left"></i>
    Continue Shopping
  </a>

  <div class="cart-container">

    <!-- CART -->
    <div class="cart" id="cartItems">

      <!-- ITEM 1 -->
      <div class="cart-item">

        <div class="left">
          <img src="images/img2.avif" alt="">

          <div class="details">
            <h2>Urban Street Pro</h2>
            <p>Rs. <span id="price1">9470</span></p>

            <div class="qty-box">
              <button onclick="changeQty(1,-1)">-</button>
              <span class="qty" id="qty1">1</span>
              <button onclick="changeQty(1,1)">+</button>
            </div>
          </div>
        </div>

        <div class="price">
          Rs. <span id="total1">9470</span>
        </div>

      </div>


      <!-- ITEM 2 -->
      <div class="cart-item">

        <div class="left">
          <img src="images/img3.avif" alt="">

          <div class="details">
            <h2>Classic Court 90s</h2>
            <p>Rs. <span id="price2">7557</span></p>

            <div class="qty-box">
              <button onclick="changeQty(2,-1)">-</button>
              <span class="qty" id="qty2">1</span>
              <button onclick="changeQty(2,1)">+</button>
            </div>
          </div>
        </div>

        <div class="price">
          Rs. <span id="total2">7557</span>
        </div>

      </div>

    </div>


    <!-- SUMMARY -->
    <div class="summary">

      <h2>Order Summary</h2>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>Rs. <span id="subtotal">17027</span></span>
      </div>

      <div class="summary-row">
        <span>Shipping</span>
        <span>Free</span>
      </div>

      <div class="summary-row">
        <span>Tax (8%)</span>
        <span>Rs. <span id="tax">1362</span></span>
      </div>

      <hr>

      <div class="summary-row total">
        <span>Total</span>
        <span>Rs. <span id="grandTotal">18389</span></span>
      </div>

      <button class="checkout">
        <a href="payment.html">Proceed to Checkout</a>
      </button>

    </div>

  </div>
  <br>
  <hr>
  <div id="footer"></div>

  <script>
    $(document).ready(function () {
      $("#header").load("header.html");
      $("#footer").load("footer.html");
    });
  </script>

  <script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let cartContainer = document.getElementById("cartItems");

    function displayCart() {

      cartContainer.innerHTML = "";
     
      let subtotal = 0;

      if (cart.length === 0) {

        cartContainer.innerHTML = "<h2>Your Cart is Empty</h2>";

        document.getElementById("subtotal").innerText = 0;
        document.getElementById("tax").innerText = 0;
        document.getElementById("grandTotal").innerText = 0;

        return;
      }

      cart.forEach((product, index) => {

        let total = product.price * product.qty;

        subtotal += total;

        cartContainer.innerHTML += `

        <div class="cart-item">

            <div class="left">

                <img src="${product.image}" alt="">

                <div class="details">

                    <h2>${product.name}</h2>

                    <p>Rs. ${product.price}</p>

                    <div class="qty-box">
                            
                        <button onclick="changeQty(${index},-1)">-</button>

                        <span class="qty">${product.qty}</span>

                        <button onclick="changeQty(${index},1)">+</button>

                    </div>

                </div>

            </div>

            <div class="price">
                Rs. ${total}
            </div>

        </div>

        `;

        let tax = Math.round(subtotal * 0.08);

        let grandTotal = subtotal + tax;

        localStorage.setItem("subtotal", subtotal);
        localStorage.setItem("tax", tax);
        localStorage.setItem("grandTotal", grandTotal);

        document.getElementById("subtotal").innerText =
          subtotal.toLocaleString();

        document.getElementById("tax").innerText =
          tax.toLocaleString();

        document.getElementById("grandTotal").innerText =
          grandTotal.toLocaleString();
      });

      let tax = Math.round(subtotal * 0.08);

      let grandTotal = subtotal + tax;

      document.getElementById("subtotal").innerText =
        subtotal.toLocaleString();

      document.getElementById("tax").innerText =
        tax.toLocaleString();

      document.getElementById("grandTotal").innerText =
        grandTotal.toLocaleString();

    }

    function changeQty(index, change) {

      cart[index].qty += change;

      if (cart[index].qty < 1) {

        cart.splice(index, 1);
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      displayCart();
    }

    displayCart();

  </script>

</body>

</html>
