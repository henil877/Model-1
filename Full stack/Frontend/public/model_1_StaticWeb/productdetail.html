    body {

      padding: 30px;
    }

    .pd-container {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
      max-width: 1100px;
      margin: 0 auto;
    }

    .left-section {
      width: 45%;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .back a {
      text-decoration: none;
      color: #666;
    }

    .back a:hover {
      color: orange;
    }

    .product-image {
      width: 100%;
      height: 480px;
      overflow: hidden;
      border-radius: 20px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .right-section {
      margin-top: 10px;
      width: 50%;
    }

    .right-section h1 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #222;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 5px;
      color: orange;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .rating .rev {
      color: #666;
      margin-left: 8px;
      font-size: 16px;
    }

    .right-section h2 {
      font-size: 38px;
      margin-bottom: 20px;
      color: #111;
    }

    .description {
      font-size: 18px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 30px;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin-bottom: 30px;
    }

    .quantity-section h3 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .quantity-box {
      width: 160px;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 30px;
      background: white;
    }

    .quantity-box button {
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      color: #666;
      padding: 0 10px;
    }

    .quantity-box span {
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .cart-btn,
    .buy-btn {
      flex: 1;
      height: 55px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .cart-btn {
      background: #f6a300;
      color: black;
    }

    .cart-btn i {
      margin-right: 8px;
    }

    .cart-btn:hover {
      background: #df9200;
    }

    .buy-btn {
      background: white;
      border: 1px solid #ddd;
    }

    .buy-btn:hover {
      background: #f0f0f0;
    }

    .bottom-links {
      display: flex;
      gap: 40px;
      color: #666;
      font-size: 16px;
    }

    .bottom-links div {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .nav-pills .nav-link {
      background: #f1f1f1;
      color: #000;
      margin-right: 10px;
      border-radius: 30px;
      padding: 10px 20px;
      font-weight: 600;
    }

    .nav-pills .nav-link.active {
      background: #f5a300 !important;
      color: #fff !important;
    }

    .tab-content {
      margin-bottom: 25px;
      color: #555;
      line-height: 28px;
      font-size: 17px;
    }

    .tab-content ul {
      padding-left: 20px;
    }

    .loading-state {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
      font-size: 20px;
      color: #888;
    }

    .not-found {
      text-align: center;
      padding: 80px 20px;
    }

    .not-found h2 {
      color: #e55;
      margin-bottom: 16px;
    }

    // Read ?id= from URL
    var params = new URLSearchParams(window.location.search);
    var id = parseInt(params.get("id"));
    var product = products[id];

    if (!product) {
      document.getElementById("loadingState").style.display = "none";
      document.getElementById("notFound").style.display = "block";
    } else {
      // Populate immediately (no need to wait for jQuery ready)
      document.title = product.name + " - BloomShop";
      // document.getElementById("prodImg").src = product.image;
      // document.getElementById("prodImg").alt = product.name;
      // document.getElementById("prodName").textContent = product.name;
      // document.getElementById("prodPrice").textContent = product.priceDisplay;
      // document.getElementById("prodShortDesc").textContent = product.shortDesc;
      // document.getElementById("tabDescription").textContent = product.description;
      // document.getElementById("tabRating").textContent = product.ratingText;
      // document.getElementById("tabRatingDetail").textContent = product.ratingDetail;

      $("#prodImg").attr("src", product.image);
      $("#prodImg").attr("alt", product.name);
      $("#prodName").text(product.name);
      $("#prodPrice").text(product.priceDisplay);
      $("#prodShortDesc").text(product.shortDesc);
      $("#tabDescription").text(product.description);
      $("#tabRating").text(product.ratingText);
      $("#tabRatingDetail").text(product.ratingDetail);

      // Stars
      var fullStars = Math.floor(product.rating);
      var starsHtml = "";
      for (var i = 0; i < fullStars; i++) starsHtml += '<i class="fa-solid fa-star"></i>';
      if (product.rating % 1 >= 0.5) starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
      document.getElementById("prodStars").innerHTML = starsHtml;
      document.getElementById("prodReviews").textContent = "(" + product.rating + ") • " + product.reviews;

      // Features
      // var featList = document.getElementById("tabFeatures");
      product.features.forEach(function (f) {
        // var li = document.createElement("li");
        // li.textContent = f;
        // featList.appendChild(li);

        $("#tabFeatures").append(`<li>${f}</li>`);
      });

      document.getElementById("loadingState").style.display = "none";
      document.getElementById("productContent").style.display = "block";

      var qty = 1;
      document.getElementById("qtyPlus").onclick = function () { qty++; document.getElementById("qtyValue").textContent = qty; };
      document.getElementById("qtyMinus").onclick = function () { if (qty > 1) { qty--; document.getElementById("qtyValue").textContent = qty; } };

      // Add to Cart
      document.getElementById("addCartBtn").onclick = function () {
        var cart = JSON.parse(localStorage.getItem("cart")) || [];
        var existing = cart.find(function (item) { return item.name === product.name; });
        if (existing) { existing.qty += qty; } else { cart.push({ name: product.name, price: product.price, image: product.image, qty: qty }); }
        localStorage.setItem("cart", JSON.stringify(cart));
        alert(qty + " x " + product.name + " added to cart!");
      };

      // Buy Now
      document.getElementById("buyNowBtn").onclick = function () {
        var cart = JSON.parse(localStorage.getItem("cart")) || [];
        var existing = cart.find(function (item) { return item.name === product.name; });
        if (existing) { existing.qty += qty; } else { cart.push({ name: product.name, price: product.price, image: product.image, qty: qty }); }
        localStorage.setItem("cart", JSON.stringify(cart));
        window.location.href = "cart.html";
      };
    }

    // Load header separately (jQuery needed for .load)
    $(document).ready(function () {
      $("#pageHeader").load("header.html");
