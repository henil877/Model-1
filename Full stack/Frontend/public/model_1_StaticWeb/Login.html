<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/Login.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/api.js"></script>
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <form id="loginForm">
            <h2>Login</h2>

            <label class="label">Username</label>
            <input type="text" id="username" autofocus required>
            <br><br>

            <label class="label">Password</label>
            <input type="password" id="password" required>
            <br><br>

            <input type="submit" value="Login" class="btn" id="loginBtn">
            <a href="Register.html" id="Register">Register</a>
        </form>
    </div>

    <script>
        $(document).ready(function () {
            $("#header").load("header.html");

            $("#loginForm").submit(async function (event) {
                event.preventDefault();

                var enteredUsername = $("#username").val().trim();
                var enteredPassword = $("#password").val();

                try {
                    const data = await apiRequest("/api/login", {
                        method: "POST",
                        body: JSON.stringify({ username: enteredUsername, password: enteredPassword })
                    });

                    localStorage.setItem("loggedInUser", JSON.stringify(data.user));
                    alert("Login Successful! Welcome back, " + (data.user.fullname || data.user.username) + "!");
                    window.location.href = "index.html";
                } catch (error) {
                    alert(error.message);
                }
            });
        });
    </script>
</body>
</html>
