<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
  <link rel="stylesheet" href="css/header.css" />
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f7f7f7; }
    .container { max-width:1200px; margin:35px auto; padding:20px; }
    h1 { text-align:center; margin-bottom:25px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px; }
    .card { background:white; border-radius:12px; padding:15px; box-shadow:0 5px 18px rgba(0,0,0,.08); }
    .card img { width:100%; height:190px; object-fit:cover; border-radius:10px; }
    .card h3 { margin:12px 0 8px; }
    .card p { color:#555; font-size:14px; min-height:44px; }
    .price { font-size:22px; font-weight:bold; color:#111; }
    .msg { text-align:center; color:#555; padding:20px; }
  </style>
</head>
<body>
  <div id="header"></div>
  <div class="container">
    <h1>Product List</h1>
    <div id="message" class="msg">Loading products...</div>
    <div id="productsGrid" class="grid"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){ $('#header').load('header.html'); });

    async function loadProducts(){
      const msg = document.getElementById('message');
      const grid = document.getElementById('productsGrid');
      try {
        const res = await fetch('https://dummyjson.com/products');
        const data = await res.json();
        grid.innerHTML = '';
        data.products.forEach(product => {
          grid.innerHTML += `
            <div class="card">
              <img src="${product.thumbnail}" alt="${product.title}">
              <h3>${product.title}</h3>
              <p>${product.description}</p>
              <div class="price">$${product.price}</div>
            </div>`;
        });
        msg.style.display = 'none';
      } catch (error) {
        msg.textContent = 'Products load nahi ho rahe. Internet/backend check karo.';
      }
    }
    loadProducts();
  </script>
</body>
</html>
