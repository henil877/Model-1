<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/Register.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/api.js"></script>
</head>
<body>
    <div id="header"></div>
    <div class="register">
        <form id="registerForm">
            <h2>Register</h2>

            <label class="label">Full Name</label>
            <input type="text" id="fullname" required autofocus placeholder="Your full name">
            <br><br>

            <label class="label">Username</label>
            <input type="text" id="username" required placeholder="Choose username">
            <br><br>

            <label class="label">Password</label>
            <input type="password" id="password" required placeholder="Choose password">
            <br><br>

            <label class="label">Email</label>
            <input type="email" id="email" required placeholder="Your email">
            <br><br>

            <label class="label">Phone Number</label>
            <input type="tel" id="phone" placeholder="Your phone number">
            <br><br>

            <input type="submit" value="Register" class="btn">
            <a href="Login.html" id="Register">Login</a>
        </form>
    </div>
   <script>
    $(document).ready(function () {

        $("#header").load("header.html");

        $("#registerForm").submit(async function (event) {
            event.preventDefault();

            var fullname = $("#fullname").val().trim();
            var username = $("#username").val().trim();
            var password = $("#password").val().trim();
            var email = $("#email").val().trim();
            var phone = $("#phone").val().trim();

            var namePattern = /^[A-Za-z ]{3,}$/;
            var usernamePattern = /^[A-Za-z0-9_]{4,}$/;
            var passwordPattern = /^(?=.*[A-Z])(?=.*[0-9]).{6,}$/;
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            var phonePattern = /^[0-9]{10}$/;

            if (!namePattern.test(fullname)) {
                alert("Full Name must contain only letters and minimum 3 characters");
                $("#fullname").focus();
                return;
            }

            if (!usernamePattern.test(username)) {
                alert("Username must be minimum 4 characters and contain only letters, numbers or underscore");
                $("#username").focus();
                return;
            }

            if (!passwordPattern.test(password)) {
                alert("Password must contain minimum 6 characters, 1 uppercase letter and 1 number");
                $("#password").focus();
                return;
            }

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address");
                $("#email").focus();
                return;
            }

            if (phone !== "" && !phonePattern.test(phone)) {
                alert("Phone number must be exactly 10 digits");
                $("#phone").focus();
                return;
            }

            try {
                const data = await apiRequest("/api/register", {
                    method: "POST",
                    body: JSON.stringify({ fullname, username, password, email, phone })
                });

                localStorage.setItem("loggedInUser", JSON.stringify(data.user));
                alert("Registration Successful! Welcome to BloomShop!");
                window.location.href = "index.html";
            } catch (error) {
                alert(error.message);
            }
        });

    });
</script>
</body>
</html>
