<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic HTML Example</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: #f4f4f4;
    }

    header{
      background: black;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav{
      margin-top: 10px;
    }

    nav a{
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
    }

    main{
    height: 500px;
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    section{
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    article{
      margin-top: 20px;
      background: #eaeaea;
      padding: 15px;
      border-radius: 10px;
    }

    aside{
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    footer{
      background: black;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }

  </style>

</head>
<body>

  <header>
    <h1>My Website</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>

    <section>

      <h2>About Us</h2>

      <p>
        This is a basic semantic HTML webpage with CSS styling.
      </p>

      <article>
        <h2>Blog Post</h2>

        <p>
          Semantic tags improve SEO and code readability.
        </p>
      </article>

    </section>

    <aside>

      <h3>Sidebar</h3>

      <p>
        Here you can add recent posts, ads, or links.
      </p>

    </aside>

  </main>

  <footer>
    <p>© 2026 My Website | All Rights Reserved</p>
  </footer>

</body>
</html>
