<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>My Form...</h1>
       User Name: <input type="text" placeholder="Enter name here..." required>
        <br><br>
       Password: <input type="password" placeholder="Enter password here..." required>
        <br><br>
        Email: <input type="email" placeholder="Enter email here..." required>
        <br><br>
        Gender: <select name="" id="">
                    <option value="Subject">Python</option>
                    <option value="Subject">HTML</option>
                    <option value="Subject">CSS</option>
                    <option value="Subject">JS</option>
                </select>
        <br><br>
        Number: <input type="number" min="1" max="100"> 
        <br><br>
        Telephone: <input type="tel" placeholder="Phone number">
        <br><br>
        URl: <input type="url" placeholder="https://example.com">
        <br><br>
        Search: <input type="search" placeholder="Search...">
        <br><br>
        Date: <input type="date">
        <br><br>
        Time: <input type="time">
        <br><br>
        DateTime: <input type="datetime-local">
        <br><br>
        Month: <input type="month">
        <br><br>
        Week: <input type="week">
        <br><br>
        Color: <input type="color">
        <br><br>
        Range: <input type="range" min="0" max="100">
        <br><br>
        Checkbox: <input type="checkbox">
        <br><br>
        Radio: <input type="radio" name="gender" value="Male">Male
                <input type="radio"name="gender" value="Female">Female
        <br><br>
        File: <input type="file">
        <br><br>
        <input type="image" src="button.png" alt="Submit">
        <br><br>
        <input type="button" value="Click Me">
        <br><br>
        <input type="submit" value="Submit">
        <br><br>
        <input type="reset">

    </form>

</html>
